# Install once per clone:  pre-commit install
# Hooks are pinned to full commit SHAs (Guidelines 6.3); Dependabot does not update
# this file, so bump it with `pre-commit autoupdate --freeze` in a reviewed PR.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: data-guard
        name: data guard (no real personal or financial data)
        entry: python tools/data_guard.py
        language: python
        types: [file]
