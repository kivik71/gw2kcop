# Erste Brokerage: "Historia_operacji_<ts>.csv", cash variant
# Format notes: research/formats/erste-bm-2026-11.md, section 2 (sample 2026-11-03).
# UTF-8 BOM, CRLF, ';', decimal comma, date only. No account number in the file.
# "Id operacji" is unique: it is the key.
#
# Trade settlements (NOT/ZLC/PW: one row with the value, one with the fee) are not
# imported here: trades and fees come from Raport_transakcji.
format = "erste_brokerage.cash"
institution = "erste_brokerage"
kind = "cash"
delimiter = ";"
decimal = ","
timezone = "Europe/Warsaw"
datetime_format = "DD-MM-YYYY"
currency = "column"
header = ["Data operacji", "Typ operacji", "Kwota", "Waluta Kwota", "Opis", "Saldo po operacji",
          "Waluta Saldo po operacji", "Id operacji"]

[columns]
date = "Data operacji"
direction = "Typ operacji"
amount = "Kwota"
currency = "Waluta Kwota"
description = "Opis"
id = "Id operacji"

[directions]
"Uznanie" = "credit"
"Obciążenie" = "debit"

# First matching rule wins. Anything not matched stops the import of the file
# (withdrawals, fees outside trades and foreign dividends are not sampled yet).
[[rules]]
pattern = '^NOT: \d+ ZLC: \d+ PW: [A-Z]{2}[A-Z0-9]{9}[0-9]$'
type = "ignore"               # trade value or fee: comes from Raport_transakcji

[[rules]]
pattern = '^Dywidenda: DP: (?P<dp>\d{4}-\d{2}-\d{2}) (?P<isin>[A-Z]{2}[A-Z0-9]{9}[0-9]) \([^()]+\);?$'
direction = "credit"
type = "dividend"
group = "div:{isin}:{dp}"

[[rules]]
pattern = '^Podatek od dywidendy: DP: (?P<dp>\d{4}-\d{2}-\d{2}) (?P<isin>[A-Z]{2}[A-Z0-9]{9}[0-9]) \([^()]+\);?$'
direction = "debit"
type = "tax"
group = "div:{isin}:{dp}"

# Older texts (seen 2017-2020 in exports from 2026-11-14): short codes with the
# instrument code (e.g. ACP) and a number. The code is an alias in instrument_aliases.csv.
[[rules]]
pattern = '^DYW\.;(?P<alias>[A-Z0-9]+);\d+$'
direction = "credit"
type = "dividend"
group = "div:{alias}:{date}"

[[rules]]
pattern = '^PD;DYW;(?P<alias>[A-Z0-9]+);\d+$'
direction = "debit"
type = "tax"                  # dividend tax, booked on the payment date
group = "div:{alias}:{date}"

[[rules]]
# Seen once (one instrument). Meaning not confirmed (likely a buy-out of shares):
# kept as "other" with the instrument until the securities history confirms it.
pattern = '^WYK\.;(?P<alias>[A-Z0-9]+);\d+$'
direction = "credit"
type = "other"

[[rules]]
pattern = '^(?i:op\.mie\.za\.prow\.rach)\d{2}/\d{2}$'
direction = "debit"
type = "charge"               # monthly account fee

[[rules]]
pattern = '^Księgowanie prowizji od dyspozycji przelewu: \d+$'
direction = "debit"
type = "charge"               # fee for a transfer order

[[rules]]
pattern = '^Przelew na rachunek bankowy '
direction = "debit"
type = "withdrawal"           # internal transfers: plan 2.4

# Deposit titles are free text (seen: the sender's transfer title). Broker wording
# must not end up here as a deposit, so texts starting with typical broker words stop the import.
[[rules]]
# Short broker codes ("XYZ.;" or "XY;") are excluded too.
pattern = '^(?!(?i:dywidenda|dyw\b|podatek|prowizja|opłata|odsetki|zwrot|korekta|księgowanie|NOT:)|[A-Za-z]{1,6}\.?;).'
direction = "credit"
type = "deposit"              # internal transfers: plan 2.4
